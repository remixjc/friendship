<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#265b4b">
    <title>FriendsShip · 考勤控制台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="root"><div class="boot">FriendsShip<span>正在连接控制台…</span></div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <span class="eyebrow">PLEASE CONFIRM</span>
        <h2>确认提交真实打卡</h2>
        <p>这会登录已配置的考勤账号，并向考勤系统提交一次打卡。请确认账号、坐标与地点正确。</p>
        <div class="actions"><button class="button secondary" value="cancel">取消</button><button class="button primary" value="confirm">确认打卡</button></div>
      </form>
    </dialog>
    <dialog id="today-leave-dialog" aria-labelledby="today-leave-title">
      <form id="today-leave-form">
        <h2 id="today-leave-title">今日休假</h2>
        <p>按个人时区设置。休假期间跳过自动任务，暂停手动真实打卡。</p>
        <label class="field">
          <span>休假范围</span>
          <select name="mode">
            <option value="all-day">全天休假</option>
            <option value="time-range">自选时段</option>
            <option value="date-range">日期范围</option>
          </select>
        </label>
        <div id="today-leave-times" hidden>
          <div class="form-grid">
            <label class="field"><span>开始时间</span><input name="startTime" type="time"></label>
            <label class="field"><span>结束时间</span><input name="endTime" type="time"></label>
          </div>
          <small class="hint">包含开始和结束分钟。</small>
        </div>
        <div id="leave-dates" hidden>
          <div class="form-grid">
            <label class="field"><span>开始日期</span><input name="startDay" type="date" max="9999-12-31"></label>
            <label class="field"><span>结束日期</span><input name="endDay" type="date" max="9999-12-31"></label>
          </div>
          <small class="hint">起止日期均计入休假，到结束日期后的第一天恢复。</small>
        </div>
        <div class="form-error" id="today-leave-error" role="alert"></div>
        <div class="actions">
          <button id="clear-today-leave" class="button danger" type="button" hidden>取消休假</button>
          <button id="close-today-leave" class="button secondary" type="button">关闭</button>
          <button class="button primary" type="submit">保存休假</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
